[package]
name = "logsluice-cli"
description = "CLI utility for logsluice: deterministic crash-recovery and NACK fault-injection replay harness (logsluice replay) and zero-point-lookup offline Kubernetes PVC state drain tool (logsluice drain)."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/logsluice-cli"
keywords = ["logging", "opentelemetry", "observability", "cli", "testing"]
categories = ["command-line-utilities", "development-tools::testing", "development-tools::profiling"]

[lints]
workspace = true

[[bin]]
name = "logsluice"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
futures-channel = { workspace = true }
hashbrown = { workspace = true }
logsluice-core = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
