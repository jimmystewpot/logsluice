[package]
name = "logsluice"
description = "Async Tokio log reduction pipeline for OpenTelemetry (OTLP) and JSON telemetry streams. Cuts observability ingestion volume 10-40x via sharded tumbling-window rollups, CIDR/template normalisation, and end-to-end delivery acknowledgements."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["opentelemetry", "logging", "observability", "telemetry", "aggregation"]
categories = ["asynchronous", "development-tools::profiling", "concurrency", "data-structures"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hashbrown = { workspace = true }
humantime-serde = { workspace = true }
indexmap = { workspace = true }
logsluice-core = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[[bench]]
name = "hot_path"
harness = false
