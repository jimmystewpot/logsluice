name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-clippy:
    name: Format & Clippy
    runs-on: arc-runner-logsluice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C linker and build tools
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  supply-chain-audit:
    name: Supply-Chain Audit (cargo-deny)
    runs-on: arc-runner-logsluice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo-deny
        run: cargo deny --all-features check advisories licenses bans sources

  test:
    name: Test
    runs-on: arc-runner-logsluice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C linker and build tools
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run workspace test suite
        run: cargo test --workspace --all-features

  package-dry-run:
    name: crates.io Package Verification
    runs-on: arc-runner-logsluice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C linker and build tools
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Verify workspace compilation
        run: cargo check --workspace --all-targets
      - name: Dry-run package logsluice-core
        run: cargo package -p logsluice-core --allow-dirty
      - name: Dry-run package logsluice
        run: cargo package --list -p logsluice --allow-dirty
      - name: Dry-run package logsluice-cli
        run: cargo package --list -p logsluice-cli --allow-dirty
