[package]
name = "logsluice-core"
description = "Sans-I/O tumbling-window log aggregation and deduplication engine. Collapses high-volume event streams into crash-exact summary slices using L1 double-buffered coalescing, SIMD kernels, and Fjall LSM storage with fair-share cardinality protection."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/logsluice-core"
keywords = ["logging", "aggregation", "deduplication", "lsm", "simd"]
categories = ["data-structures", "algorithms", "database", "concurrency"]

[lints]
workspace = true

[features]
default = []
test-util = []

[dependencies]
bytes = { workspace = true }
fjall = { workspace = true }
futures-channel = { workspace = true }
hashbrown = { workspace = true }
humantime-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "hot_path"
harness = false
