[workspace]
resolver = "3"
members = [
    "crates/logsluice-core",
    "crates/logsluice",
    "crates/logsluice-cli",
]
exclude = [
    "bridges/logsluice-vector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jimmystewpot/logsluice"
homepage = "https://github.com/jimmystewpot/logsluice"
documentation = "https://docs.rs/logsluice"
keywords = ["logging", "opentelemetry", "aggregation", "observability", "lsm"]
categories = ["development-tools::profiling", "data-structures"]

[workspace.dependencies]
# Internal workspace crates (version + path required for crates.io publishing)
logsluice-core = { version = "0.1.0", path = "crates/logsluice-core" }
logsluice = { version = "0.1.0", path = "crates/logsluice" }

# Production dependencies
bytes = { version = "1.11", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive"] }
fjall = "3.1.12"
futures = "0.3"
futures-channel = "0.3"
hashbrown = "0.17"
humantime-serde = "1.1"
indexmap = { version = "2.14", features = ["serde"] }
metrics = "0.24"
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["sync", "time", "rt", "macros"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Dev / benchmark dependencies
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
serde_yaml_ng = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
