name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run full test suite before publish
        run: cargo test --workspace --all-features
      - name: Publish logsluice-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice-core
      - name: Wait for crates.io index propagation
        run: sleep 30
      - name: Publish logsluice
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice
      - name: Wait for crates.io index propagation
        run: sleep 30
      - name: Publish logsluice-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice-cli

  build-release-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build logsluice CLI release binary
        run: cargo build --release -p logsluice-cli --target ${{ matrix.target }}
      - name: Package archive and SHA-256 checksum
        run: |
          ARCHIVE="logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$ARCHIVE" logsluice
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
