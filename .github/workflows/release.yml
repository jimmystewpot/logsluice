name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: arc-runner-logsluice
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run full test suite before publish
        run: cargo test --workspace --all-features
      - name: Publish logsluice-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice-core
      - name: Wait for crates.io index propagation
        run: sleep 45
      - name: Publish logsluice
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice
      - name: Wait for crates.io index propagation
        run: sleep 45
      - name: Publish logsluice-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice-cli

  build-release-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: arc-runner-logsluice
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build logsluice CLI release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p logsluice-cli --target ${{ matrix.target }}
      - name: Package archive and SHA-256 checksum
        run: |
          ARCHIVE="logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$ARCHIVE" logsluice
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
      - name: Attach release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
