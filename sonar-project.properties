sonar.projectKey=jimmystewpot_logsluice
sonar.organization=jimmystewpot


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=logsluice
sonar.projectVersion=0.1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=crates/logsluice-core/src,crates/logsluice/src,crates/logsluice-cli/src
sonar.tests=crates/logsluice-core/tests,crates/logsluice/tests,crates/logsluice-cli/tests
sonar.exclusions=**/benches/**,bridges/**,target/**

# Coverage and Clippy reports generated in CI
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy-report.json

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
