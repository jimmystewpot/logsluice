name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: arc-runner-logsluice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release tag is on main and matches Cargo.toml
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: tag ${GITHUB_REF_NAME} ($(git rev-parse HEAD)) is not an ancestor of origin/main" >&2
            exit 1
          fi
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -n 1)"
          EXPECTED_TAG="v${CARGO_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match Cargo.toml workspace version (${EXPECTED_TAG})" >&2
            exit 1
          fi
      - name: Install C linker and build tools
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run full test suite before publish
        run: cargo test --workspace --all-features
      - name: Publish logsluice-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice-core
      - name: Wait for crates.io index propagation
        run: sleep 45
      - name: Publish logsluice
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice
      - name: Wait for crates.io index propagation
        run: sleep 45
      - name: Publish logsluice-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p logsluice-cli

  build-release-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: arc-runner-logsluice
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release tag is on main and matches Cargo.toml
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: tag ${GITHUB_REF_NAME} ($(git rev-parse HEAD)) is not an ancestor of origin/main" >&2
            exit 1
          fi
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -n 1)"
          EXPECTED_TAG="v${CARGO_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match Cargo.toml workspace version (${EXPECTED_TAG})" >&2
            exit 1
          fi
      - name: Install C linker and build tools
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y --no-install-recommends build-essential gcc-aarch64-linux-gnu
          else
            sudo apt-get install -y --no-install-recommends build-essential
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build logsluice CLI release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p logsluice-cli --target ${{ matrix.target }}
      - name: Package archive and SHA-256 checksum
        run: |
          ARCHIVE="logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$ARCHIVE" logsluice
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
      - name: Attach release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            logsluice-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
